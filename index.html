  color: #666;

function shuffle(array) {
  const arr = [...array];

  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }

  return arr;
}

function getPool() {
  if (selected.size === 0) {
    return Object.values(groups).flat();
  }

  let pool = [];

  selected.forEach(key => {
    pool.push(...groups[key]);
  });

  return pool;
}

function rebuildQueue() {
  const previous = currentItem;
  queue = shuffle(getPool());

  // 直前と同じ問題が続かないようにする
  if (queue.length > 1 && queue[0] === previous) {
    [queue[0], queue[1]] = [queue[1], queue[0]];
  }

  queueIndex = 0;
}

function startStudy(type) {
  mode = type;
  selected.clear();
  count = 1;
  currentItem = "";

  if (type === "hiragana") {
    groups = hiraganaGroups;
    document.getElementById("screenTitle").textContent = "ひらがな";
    kanaArea.style.display = "block";
    wordArea.style.display = "none";

    kanaArea.style.display = "block";
    wordArea.style.display = "none";

  rebuildQueue();
  showCurrent();

  window.scrollTo(0, 0);
}

function backToMenu() {
  study.style.display = "none";
  menu.style.display = "block";
  controls.innerHTML = "";
  window.scrollTo(0, 0);
}

function createGroupButtons() {
  controls.innerHTML = "";

  let groupRanges;

  if (mode === "hiragana") {
    groupRanges = [
      ["あ～な", ["あ","か","さ","た","な"]],
      ["は～わ", ["は","ま","や","ら","わ"]],
      ["が～ぱ", ["が","ざ","だ","ば","ぱ"]],
      ["きゃ～ぴゃ", [
        "きゃ","しゃ","ちゃ","にゃ","ひゃ","みゃ","りゃ",
        "ぎゃ","じゃ","びゃ","ぴゃ"
      ]]
    ];
  } else if (mode === "katakana") {
    groupRanges = [
      ["ア～ナ", ["ア","カ","サ","タ","ナ"]],
      ["ハ～ワ", ["ハ","マ","ヤ","ラ","ワ"]],
      ["ガ～パ", ["ガ","ザ","ダ","バ","パ"]],
      ["キャ～ピャ", [
        "キャ","シャ","チャ","ニャ","ヒャ","ミャ","リャ",
        "ギャ","ジャ","ビャ","ピャ"
      ]]
    ];
  } else if (isWordMode()) {
    // ことば画面
    const wordLabels = {
      "清音": "ស្រាល",
      "濁音": "ធ្ងន់",
      "撥音": "ប្រកប",
      "長音": "វែង",
      "拗音": "ជើង",
      "促音": "សង្កត់"
    };

    const heading = document.createElement("div");
    heading.textContent = "សំលេង";
    heading.style.gridColumn = "1 / -1";
    heading.style.fontSize = "22px";
    heading.style.fontWeight = "bold";
    heading.style.marginBottom = "4px";
    controls.appendChild(heading);

    groupRanges = Object.keys(groups).map(key => [
      wordLabels[key] || key,
      [key]
    ]);
  }

  groupRanges.forEach(([label, keys]) => {
    const btn = document.createElement("button");
    btn.textContent = label;
    btn.className = "rowBtn";

    btn.onclick = () => {
      const allSelected = keys.every(key => selected.has(key));

      if (allSelected) {
        keys.forEach(key => selected.delete(key));
      } else {
        keys.forEach(key => selected.add(key));
      }

      Array.from(controls.children).forEach((otherBtn, index) => {
        if (isWordMode() && index === 0) return;

        const rangeIndex = isWordMode() ? index - 1 : index;
        const otherKeys = groupRanges[rangeIndex][1];

        otherBtn.classList.toggle(
          "active",
          otherKeys.every(key => selected.has(key))
        );
      });

      count = 1;
      currentItem = "";
      rebuildQueue();
      showCurrent();
    };

    controls.appendChild(btn);
  });
}
function showCurrent() {
  if (queue.length === 0) {
    rebuildQueue();
  }

  currentItem = queue[queueIndex];

  if (isWordMode()) {
    document.getElementById("jp").textContent = currentItem;
    document.getElementById("kh").textContent = "";
    document.getElementById("wordNextBtn").textContent = "ចម្លើយ";
    showTranslation = false;
  } else {
    document.getElementById("kanaQuestion").textContent = currentItem;
  }

  document.getElementById("counter").textContent = count;
}

function nextKana() {
  count++;
  queueIndex++;

  if (queueIndex >= queue.length) {
    rebuildQueue();
  }

  showCurrent();
}

function handleWordClick() {
  if (!showTranslation) {
    document.getElementById("kh").textContent =
      activeDict[currentItem] || "訳が登録されていません";

    showTranslation = true;
    document.getElementById("wordNextBtn").textContent = "▶";
    return;
  }

  count++;
  queueIndex++;

  if (queueIndex >= queue.length) {
    rebuildQueue();
  }

  showCurrent();
}
</script>
